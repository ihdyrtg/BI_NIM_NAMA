<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="100%" height="100%" fill="#F8FAFC"/>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#0F172A} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#475569} .box{fill:#FFFFFF;stroke:#0F766E;stroke-width:2} .head{fill:#123B5D} .headtext{fill:#FFFFFF;font-size:18px;font-weight:700} .label{font-size:17px;font-weight:700} .small{font-size:14px;fill:#475569} .arrow{stroke:#0F766E;stroke-width:4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker></defs>
<text x="65" y="65" class="title">M07 - Report Architecture</text><text x="65" y="100" class="sub">Overview -> compare -> detail, with hidden context pages</text><rect x="100" y="210" width="300" height="150" rx="20" class="box"/><text x="250" y="270" text-anchor="middle" class="label">Executive</text><text x="250" y="310" text-anchor="middle" class="small">KPI | Trend | Branch</text><path d="M400 285 L475 285" class="arrow"/><rect x="500" y="210" width="300" height="150" rx="20" class="box"/><text x="650" y="270" text-anchor="middle" class="label">Product & Campaign</text><text x="650" y="310" text-anchor="middle" class="small">Top Product | Category | Campaign</text><path d="M800 285 L875 285" class="arrow"/><rect x="900" y="210" width="300" height="150" rx="20" class="box"/><text x="1050" y="270" text-anchor="middle" class="label">Branch & Customer</text><text x="1050" y="310" text-anchor="middle" class="small">Branch | Segment | Matrix</text><text x="100" y="410" class="small">Page Navigator: ketiga halaman utama saja</text>
<rect x="245" y="500" width="360" height="150" rx="20" class="box"/><text x="425" y="555" text-anchor="middle" class="label">Branch Detail (hidden)</text><text x="425" y="595" text-anchor="middle" class="small">Drillthrough Branch_Name -> transaction table</text>
<path d="M1050 360 C1000 460 750 500 620 550" class="arrow"/>
<rect x="795" y="500" width="360" height="150" rx="20" class="box"/><text x="975" y="555" text-anchor="middle" class="label">Tooltip Product (hidden)</text><text x="975" y="595" text-anchor="middle" class="small">Hover Product_Name -> KPI + monthly trend</text>
<path d="M650 360 C700 445 820 460 850 500" class="arrow"/>
<text x="100" y="720" class="small">Executive bookmark modes: Fokus Penjualan / Fokus Laba. Turn Data off when preserving user slicers is the intent.</text></svg>