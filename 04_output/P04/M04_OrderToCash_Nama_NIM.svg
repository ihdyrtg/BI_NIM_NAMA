<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="100%" height="100%" fill="#F8FAFC"/>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#0F172A} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#475569} .box{fill:#FFFFFF;stroke:#0F766E;stroke-width:2} .head{fill:#123B5D} .headtext{fill:#FFFFFF;font-size:18px;font-weight:700} .label{font-size:17px;font-weight:700} .small{font-size:14px;fill:#475569} .arrow{stroke:#0F766E;stroke-width:4;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker></defs>
<text x="70" y="70" class="title">M04 - Order-to-Cash</text><text x="70" y="105" class="sub">Lima tahap proses + field data; Fact_Operations tetap pada grain bulanan-cabang</text><rect x="60" y="260" rx="16" width="220" height="180" class="box"/><text x="170" y="315" text-anchor="middle" class="label">1. Pilih Produk</text><foreignObject x="80" y="340" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial;font-size:14px;text-align:center;color:#475569">Product_ID | Quantity | Unit_Price</div></foreignObject><path d="M280 350 L310 350" class="arrow"/><rect x="325" y="260" rx="16" width="220" height="180" class="box"/><text x="435" y="315" text-anchor="middle" class="label">2. Transaksi</text><foreignObject x="345" y="340" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial;font-size:14px;text-align:center;color:#475569">Transaction_ID | Date | Branch | Customer | Channel</div></foreignObject><path d="M545 350 L575 350" class="arrow"/><rect x="590" y="260" rx="16" width="220" height="180" class="box"/><text x="700" y="315" text-anchor="middle" class="label">3. Pembayaran</text><foreignObject x="610" y="340" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial;font-size:14px;text-align:center;color:#475569">Payment_Method</div></foreignObject><path d="M810 350 L840 350" class="arrow"/><rect x="855" y="260" rx="16" width="220" height="180" class="box"/><text x="965" y="315" text-anchor="middle" class="label">4. Pemenuhan</text><foreignObject x="875" y="340" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial;font-size:14px;text-align:center;color:#475569">Avg_Fulfillment_Hours*</div></foreignObject><path d="M1075 350 L1105 350" class="arrow"/><rect x="1120" y="260" rx="16" width="220" height="180" class="box"/><text x="1230" y="315" text-anchor="middle" class="label">5. Retur/Keluhan</text><foreignObject x="1140" y="340" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial;font-size:14px;text-align:center;color:#475569">Return_Flag | Complaint_Count*</div></foreignObject><text x="70" y="520" class="small">* Fact_Operations: month x branch. Jangan merge langsung ke transaksi hanya dengan Branch_ID.</text></svg>